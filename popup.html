<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/icon.png" type="image/png">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <title>Scientific Calculator </title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            background: #a8a8a8;
        }

        /* The popup is as tall as the browser lets a popup be, 600px: the calculator is
           drawn a little bigger to fill it, 594 for its 580px, with a little room around it */
        body {
            box-sizing: border-box;
            width: 397px;
            height: 600px;
            padding: 3px 4px;
            overflow: hidden;
        }

        html:not(.detached) #calculator {
            margin: 0;
            transform: scale(1.0241);
            transform-origin: 0 0;
        }

        /* detached mode: the calculator sits in the middle of its window and is
           scaled to the window by popup.js */
        .detached,
        .detached body {
            width: auto;
            height: 100%;
            padding: 0;
            overflow: hidden;
        }

        .detached #calculator {
            position: fixed;
            left: 50%;
            top: 50%;
            margin: 0;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <!-- calculator: scripts/sync-web.sh copies it from here into web/index.html -->
    <div id="calculator" class="text-center">
        <div class="calc-head">
            <span class="logo">Scientific Calculator</span>
            <span class="calc-help">?</span>

        </div>
        <form class="form-control">
            <div class="calc-main">
                <div id="display-box" class="calc-display">
                    <span id="box">0</span>
                    <div class="calc-rad">Rad<span class="sign">2<span class="sign-pi">π</span></span></div>
                    <div class="calc-mem"></div>
                    <div class="notification"></div>
                    <div class="calc-log"></div>
                    <div class="calc-hold"></div>
                    <div class="calc-fmt"></div>
                    <div class="calc-frac"></div>
                    <!-- at the top left: the history, and the panels turned on in the options, in their order there -->
                    <div class="calc-tools">
                        <div class="calc-hist" hidden>
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 8a6 6 0 1 0 6-6 6.5 6.5 0 0 0-4.5 1.83L2 5.33" />
                                <path d="M2 2v3.33h3.33" transform="rotate(2 2 5.33)" />
                                <path d="M8 5.2v3l2 1.3" />
                            </svg>
                        </div>
                        <!-- formulas and constants -->
                        <div class="calc-fx-btn" hidden>
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M8.5 2.3c-1.5-.4-2.6.3-2.9 1.9L4.3 11.8c-.3 1.6-1.2 2.2-2.6 1.9" />
                                <path d="M3.3 6.3h4.2" />
                                <path d="M9.6 8l4.4 5.2M14 8l-4.4 5.2" />
                            </svg>
                        </div>
                        <!-- the converter of units -->
                        <div class="calc-conv-btn" hidden>
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3.5 5h9.5M10.5 2.5l2.5 2.5-2.5 2.5" />
                                <path d="M12.5 11H3M5.5 8.5L3 11l2.5 2.5" />
                            </svg>
                        </div>
                        <!-- statistics of a list of numbers -->
                        <div class="calc-stat-btn" hidden>
                            <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                                stroke-width="1.8" stroke-linecap="round">
                                <path d="M3.5 13.5V9M8 13.5V3M12.5 13.5V6.5" />
                            </svg>
                        </div>
                    </div>
                </div>


                <div class="calc-left calc-top">
                    <!-- modes, the display of results, and brackets -->
                    <div class="trigo-keys">
                        <div>2nd</div>
                    </div>
                    <div class="trigo-keys" id="rad">
                        <div>Deg</div>
                    </div>
                    <div class="trigo-keys">
                        <div>a/b</div>
                    </div>
                    <div class="trigo-keys">
                        <div>°′″</div>
                    </div>
                    <div class="trigo-keys">
                        <div>(</div>
                    </div>
                    <div class="trigo-keys">
                        <div>)</div>
                    </div>
                    <div class="trigo-keys calc-mode">
                        <div>MODE</div>
                    </div>

                    <!-- powers and roots -->
                    <div class="trigo-keys">
                        <div>x<sup>2</sup></div>
                    </div>
                    <div class="trigo-keys">
                        <div>x<sup>3</sup></div>
                    </div>
                    <div class="trigo-keys">
                        <div>y<sup>x</sup></div>
                    </div>
                    <div class="trigo-keys">
                        <div>1/x</div>
                    </div>
                    <div class="trigo-keys">
                        <div><span class="calc-sq">√</span></div>
                    </div>
                    <div class="trigo-keys">
                        <div class="calc-radxy">
                            <sup>x</sup><em class="calc-sq">√</em><span>y</span>
                        </div>
                    </div>
                    <div class="trigo-keys">
                        <div>EE</div>
                    </div>

                    <!-- trigonometry; 2nd turns them into their inverses -->
                    <div class="trigo-keys">
                        <div>sin</div>
                    </div>
                    <div class="trigo-keys">
                        <div>cos</div>
                    </div>
                    <div class="trigo-keys">
                        <div>tan</div>
                    </div>
                    <div class="trigo-keys">
                        <div>sinh</div>
                    </div>
                    <div class="trigo-keys">
                        <div>cosh</div>
                    </div>
                    <div class="trigo-keys">
                        <div>tanh</div>
                    </div>
                    <div class="trigo-keys">
                        <div>&pi;</div>
                    </div>

                    <!-- logarithms and functions -->
                    <div class="trigo-keys">
                        <div>log</div>
                    </div>
                    <div class="trigo-keys">
                        <div>ln</div>
                    </div>
                    <div class="trigo-keys">
                        <div>e<sup>x</sup></div>
                    </div>
                    <div class="trigo-keys">
                        <div>abs</div>
                    </div>
                    <div class="trigo-keys">
                        <div>x!</div>
                    </div>
                    <div class="trigo-keys">
                        <div class="calc-ncr"><i>n</i>C<i>r</i></div>
                    </div>
                    <div class="trigo-keys">
                        <div class="calc-ncr"><i>n</i>P<i>r</i></div>
                    </div>

                    <!-- numbers and the memory -->
                    <div class="trigo-keys">
                        <div>%</div>
                    </div>
                    <div class="trigo-keys">
                        <div>Rand</div>
                    </div>
                    <div class="trigo-keys">
                        <div>Ans</div>
                    </div>
                    <div class="trigo-keys">
                        <div>mc</div>
                    </div>
                    <div class="trigo-keys">
                        <div>m+</div>
                    </div>
                    <div class="trigo-keys">
                        <div>m-</div>
                    </div>
                    <div class="trigo-keys">
                        <div>mr</div>
                    </div>
                </div>
                <div class="calc-right ">

                    <div class="calc-black keys ">
                        <div>7</div>
                    </div>
                    <div class="calc-black keys">
                        <div>8</div>
                    </div>
                    <div class="calc-black keys">
                        <div>9</div>
                    </div>
                    <div id="del" class="calc-brown keys del-ac">
                        <div>DEL</div>
                    </div>
                    <div class="calc-brown keys del-ac">
                        <div>AC</div>
                    </div>
                    <div class="calc-black keys">
                        <div>4</div>
                    </div>
                    <div class="calc-black keys">
                        <div>5</div>
                    </div>
                    <div class="calc-black keys">
                        <div>6</div>
                    </div>
                    <div class="calc-brown calc-f21 keys keys2">
                        <div>&times;</div>
                    </div>
                    <div class="calc-brown calc-f19 keys keys2">
                        <div>&divide;</div>
                    </div>
                    <div class="calc-black keys">
                        <div>1</div>
                    </div>
                    <div class="calc-black keys">
                        <div>2</div>
                    </div>
                    <div class="calc-black keys">
                        <div>3</div>
                    </div>
                    <div class="calc-brown calc-f18 keys keys2 ">
                        <div>+</div>
                    </div>
                    <div class="calc-brown calc-f18 keys keys2">
                        <div>&#8211;</div>
                    </div>
                    <div class="calc-black calc-zero keys">
                        <div>
                            <span>0</span>
                        </div>
                    </div>
                    <div class="calc-black calc-f21 keys">
                        <div>.</div>
                    </div>
                    <div class="calc-brown keys  ">
                        <div>+/&#8211;</div>
                    </div>

                    <div class="calc-down equal keys calc-orange calc-eq calc-f17 keys2">=</div>
                    <span class="raad"> raad.dev </span>
                    <textarea class="calc-blank" tabindex="-1" aria-hidden="true"></textarea>

                </div>
            </div>
        </form>

        <!-- the menu of a right click; main.js fills it for where it opens -->
        <div class="calc-menu-box" hidden></div>

        <!-- statistics of a list of numbers, over the keys like the history -->
        <div class="calc-past calc-stats">
            <div class="calc-past-head">
                <span>Statistics</span>
                <!-- what is between the numbers: found by itself, or the one chosen -->
                <span class="calc-stats-by-label">Separator</span>
                <div class="calc-conv-pick calc-stats-by" tabindex="0" role="combobox" aria-haspopup="listbox"
                    aria-expanded="false" aria-label="Between the numbers" title="What is between the numbers">
                    <span class="calc-conv-chosen"></span>
                    <div class="calc-conv-menu" role="listbox" hidden></div>
                </div>
                <span class="calc-past-clear">Clear</span>
                <span class="calc-past-close"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13" /></svg></span>
            </div>
            <textarea class="calc-stats-input" spellcheck="false" maxlength="20000"
                placeholder="Type or paste numbers: 4 8 15 16 23 42"></textarea>
            <div class="calc-stats-note"></div>
            <div class="calc-stats-grid"></div>
        </div>

        <!-- formulas and constants, over the keys like the history -->
        <div class="calc-past calc-fx">
            <div class="calc-past-head">
                <span class="calc-fx-tabs">
                    <span class="calc-fx-tab" data-tab="formulas">Formulas</span>
                    <span class="calc-fx-tab" data-tab="constants">Constants</span>
                </span>
                <span class="calc-past-close"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13" /></svg></span>
            </div>
            <input class="calc-fx-search" type="text" spellcheck="false" autocomplete="off" maxlength="60" placeholder="Search">
            <div class="calc-fx-list"></div>
        </div>

        <!-- the converter of units, over the keys like the history -->
        <div class="calc-past calc-conv">
            <div class="calc-past-head">
                <span>Converter</span>
                <span class="calc-past-close"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13" /></svg></span>
            </div>
            <!-- lists drawn as the calculator draws, not by the browser -->
            <div class="calc-conv-pick calc-conv-group" tabindex="0" role="combobox" aria-haspopup="listbox"
                aria-expanded="false" aria-label="What to convert">
                <span class="calc-conv-chosen"></span>
                <div class="calc-conv-menu" role="listbox" hidden></div>
            </div>
            <div class="calc-conv-from">
                <input class="calc-conv-value" type="text" inputmode="decimal" pattern="-?[0-9°′″]*[.,]?[0-9°′″]*" spellcheck="false" autocomplete="off"
                    maxlength="40" aria-label="Value">
                <div class="calc-conv-pick calc-conv-unit" tabindex="0" role="combobox" aria-haspopup="listbox"
                    aria-expanded="false" aria-label="From">
                    <span class="calc-conv-chosen"></span>
                    <div class="calc-conv-menu" role="listbox" hidden></div>
                </div>
            </div>
            <div class="calc-conv-note"></div>
            <div class="calc-conv-list"></div>
        </div>

        <!-- what a key above the digits does, while the pointer rests on it -->
        <div class="calc-tip" hidden></div>


        <!-- the calculations done so far, over the keys -->
        <div class="calc-past">
            <div class="calc-past-head">
                <span>History</span>
                <span class="calc-past-clear">Clear</span>
                <span class="calc-past-close"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13" /></svg></span>
            </div>
            <div class="calc-past-list"></div>
        </div>
    </div>
    <!-- /calculator -->

    <script src="js/engine.js"></script>
    <script src="js/tips.js"></script>
    <script src="js/formulas.js"></script>
    <script src="js/units.js"></script>
    <script src="js/main.js"></script>
    <script src="js/popup.js"></script>
</body>

</html>
