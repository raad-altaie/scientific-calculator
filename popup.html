<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imgs/icon.png" type="image/png">
    <title>Scientific Calculator </title>
    <style>
        html,
        body {
            padding: 0;
            margin: 0;
            background: #bebebe;
        }

        iframe {
            display: block; /* no empty strip under the calculator */
            width: 388px;
            height: 538px;
        }

        /* detached mode: the calculator sits in the middle of its window and is
           scaled to the window by popup.js */
        .detached,
        .detached body {
            height: 100%;
            overflow: hidden;
        }

        .detached iframe {
            position: fixed;
            left: 50%;
            top: 50%;
        }
    </style>
</head>

<body>
    <iframe id="calc-iframe" src="calc.html" frameborder="0" scrolling="no"></iframe>
    <script src="./js/popup.js"></script>
</body>

</html>
